<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼성365정형외과 경영 대시보드</title>
<style>
:root{
  color-scheme: light;
  --page:#f3f6fa; --surface:#ffffff; --surface-2:#f6f8fb; --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#0f1b2d; --text-2:#475569; --muted:#7b8798;
  --grid:#e8edf3; --axis:#c3cbd6;
  --navy:#0f2a4a; --navy-2:#1a3d68; --navy-text:#c4d2e6;
  --brand:#1f5fbf; --brand-soft:#e8f0fb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --warn-text:#8a5a00; --serious:#ec835a; --serious-text:#a1441c; --crit:#d03b3b; --crit-text:#b42323;
  --info:#5b7fb8; --mute:#a3adbb;
  --good-bg:#e8f5e8; --warn-bg:#fff6df; --serious-bg:#fdeee7; --crit-bg:#fcebeb; --info-bg:#ebf1fa; --mute-bg:#eef1f5;
  --shadow:0 1px 2px rgba(15,27,45,.05),0 1px 3px rgba(15,27,45,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0a121d; --surface:#111c2b; --surface-2:#16233a; --border:#22324a; --border-strong:#304463;
    --text:#e8eef7; --text-2:#b4c0d3; --muted:#8492a8; --grid:#1d2b40; --axis:#33465f;
    --navy:#08172a; --navy-2:#173459; --navy-text:#b9c8de;
    --brand:#3987e5; --brand-soft:#15294a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good-text:#3fc23f; --warn-text:#fab219; --serious-text:#ec835a; --crit-text:#ee7a7a;
    --info:#7c9cd0; --mute:#5c6a80;
    --good-bg:#10291a; --warn-bg:#2d2410; --serious-bg:#2f1b12; --crit-bg:#331616; --info-bg:#132640; --mute-bg:#1a2638;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0a121d; --surface:#111c2b; --surface-2:#16233a; --border:#22324a; --border-strong:#304463;
  --text:#e8eef7; --text-2:#b4c0d3; --muted:#8492a8; --grid:#1d2b40; --axis:#33465f;
  --navy:#08172a; --navy-2:#173459; --navy-text:#b9c8de;
  --brand:#3987e5; --brand-soft:#15294a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good-text:#3fc23f; --warn-text:#fab219; --serious-text:#ec835a; --crit-text:#ee7a7a;
  --info:#7c9cd0; --mute:#5c6a80;
  --good-bg:#10291a; --warn-bg:#2d2410; --serious-bg:#2f1b12; --crit-bg:#331616; --info-bg:#132640; --mute-bg:#1a2638;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
/* sidebar */
.side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--navy);color:var(--navy-text);display:flex;flex-direction:column;z-index:40;transition:transform .2s ease}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:-.01em}
.brand span{font-size:12px;opacity:.75}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--navy-text);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 #5aa2ff}
.side-foot{margin-top:auto;padding:16px 20px;font-size:11.5px;opacity:.7;line-height:1.55}
.scrim{display:none}
/* main */
.main{margin-left:236px;min-width:0}
.top{position:sticky;top:0;z-index:30;background:var(--page);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 28px}
.top h1{font-size:18px;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.chip.bad .dot{background:var(--crit)}
.menu-btn{display:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
.content{padding:22px 28px 48px;max-width:1480px}
.page-desc{margin:0 0 16px;color:var(--text-2);font-size:13px}
.foot-note{margin-top:24px;font-size:12px;color:var(--muted)}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:15px 18px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12.5px;color:var(--text-2);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:6px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .s b{color:var(--text-2)}
.delta{font-size:12px;font-weight:700;white-space:nowrap}
.delta.up,.pos{color:var(--good-text)} .delta.down,.neg{color:var(--crit-text)} .delta.flat{color:var(--muted)}
.prog{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin-top:8px}
.prog>i{display:block;height:100%;background:var(--brand);border-radius:3px}
/* layout */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px 18px;box-shadow:var(--shadow);min-width:0;margin-bottom:16px}
.grid2>.panel,.grid3>.panel{margin-bottom:0}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 12px;margin-bottom:12px;flex-wrap:wrap}
.panel-h h3{margin:0;font-size:15px;letter-spacing:-.01em}
.panel-sub{margin:2px 0 0;color:var(--muted);font-size:12px}
.panel-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* chart */
.chart{position:relative;min-width:0}
.chart svg{display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .axis{stroke:var(--axis);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .lab{fill:var(--text-2);font-size:12px}
.chart .val{fill:var(--text-2);font-size:11.5px;font-variant-numeric:tabular-nums}
.chart .endlab{fill:var(--text-2);font-size:11.5px}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{stroke:var(--surface);stroke-width:2}
.chart .target{stroke:var(--text-2);stroke-dasharray:4 4;stroke-width:1}
.chart .xhair{stroke:var(--axis);stroke-width:1}
.chart .hl{fill:var(--text);opacity:.05}
.chart .hit{fill:transparent}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-2);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.dash{height:3px;border-radius:0;vertical-align:3px;background-image:linear-gradient(90deg,currentColor 60%,transparent 60%)!important;background-size:5px 3px!important}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(15,27,45,.16);min-width:150px;white-space:nowrap}
.tip b{display:block;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:6px}
.tip .tr i{width:8px;height:8px;border-radius:2px;flex:none}
.tip .tr span{color:var(--text-2);flex:1}
.tip .tr strong{font-variant-numeric:tabular-nums;margin-left:12px}
.tip .tot{border-top:1px solid var(--border);margin-top:4px;padding-top:4px}
/* controls */
input,select{font:inherit;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
input[type=range]{padding:0;border:0;accent-color:var(--brand);width:100%}
.btn{font-weight:600;font-size:13px;border-radius:8px;padding:8px 14px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn.danger{background:var(--crit);border-color:var(--crit)}
.btn:hover{filter:brightness(1.06)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:12.5px;color:var(--text-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--border-strong)}
.seg button.on{background:var(--brand);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
/* table */
.tb-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tb-tools .sp{flex:1}
.tb-q{width:220px;max-width:100%}
.tb-count{font-size:12px;color:var(--muted)}
.tb-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:560px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;color:var(--text-2);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:1}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--text)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.clickable{cursor:pointer}
.tbl tfoot td{position:sticky;bottom:0;background:var(--surface-2);font-weight:700;border-top:1px solid var(--border-strong)}
.tbl input,.tbl select{padding:4px 6px;font-size:12.5px}
.tbl input[type=number]{width:120px;text-align:right}
.tbl td.empty{text-align:center;color:var(--muted);padding:28px}
.sub-row{color:var(--muted);font-size:12px}
/* badges & alerts */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-good{background:var(--good-bg);color:var(--good-text)}
.b-warn{background:var(--warn-bg);color:var(--warn-text)}
.b-serious{background:var(--serious-bg);color:var(--serious-text)}
.b-crit{background:var(--crit-bg);color:var(--crit-text)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-mute{background:var(--mute-bg);color:var(--muted)}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn);padding:12px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}
.notice.info{background:var(--info-bg);border-color:var(--info)}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border)}
.alerts b{display:block;font-size:13px}
.alerts span{font-size:12.5px;color:var(--text-2)}
.ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;line-height:1}
.ic.good{background:var(--good)} .ic.warn{background:var(--warn);color:#3a2a00} .ic.crit{background:var(--crit)}
/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-2);font-weight:600}
.form .full{grid-column:1/-1}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.form h4{grid-column:1/-1;margin:6px 0 0;font-size:13px;color:var(--text)}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mini div{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-width:0}
.mini span{font-size:12px;color:var(--text-2)}
.mini b{display:block;font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini em{font-style:normal;font-size:12px}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px}
.rng{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:12.5px;color:var(--text-2);font-weight:600}
.rng .row{display:flex;justify-content:space-between;gap:8px}
.rng output{color:var(--text);font-variant-numeric:tabular-nums}
.formula{margin:0;padding-left:18px;color:var(--text-2);font-size:13px;line-height:1.9}
.formula code{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--text);font-size:12.5px}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(8,18,32,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:16px}
.modal-b{padding:18px 20px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.modal-f .left{margin-right:auto}
.icon-btn{background:none;border:0;font-size:18px;color:var(--text-2);cursor:pointer;padding:4px 8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:200;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
/* mobile */
@media (max-width:900px){
  .side{transform:translateX(-100%)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  .main{margin-left:0}
  .menu-btn{display:inline-flex}
  .top{padding:10px 16px}
  .top .chip.date{display:none}
  .content{padding:16px 16px 40px}
  .sim{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .kpi{padding:12px 14px}
  .kpi .v{font-size:19px}
}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand"><b>삼성365정형외과</b><span>통합 경영관리 대시보드</span></div>

<div class="main">

</div>

<script>
'use strict';
/* ========== 기본 유틸 ========== */
const KEY = 's365_mgmt_dashboard_v2';
const nf = new Intl.NumberFormat('ko-KR');
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => nf.format(Math.round(n || 0));
const won = n => num(n) + '원';
const sum = (arr, k) => arr.reduce((a, r) => a + (typeof k === 'function' ? k(r) : (+r[k] || 0)), 0);
const toInt = v => { const n = Math.round(+String(v).replace(/[^\d.-]/g, '')); return isFinite(n) ? n : 0; };
const toPos = v => Math.max(0, toInt(v));

// 한국식 금액 표기: 9억 5,320만원
function krw(n) {
  n = Math.round(n || 0);
  const sign = n < 0 ? '-' : '';
  const a = Math.abs(n);
  let eok = Math.floor(a / 1e8), man = Math.round((a % 1e8) / 1e4);

function hbar(el, o) {

    <label>휴일근로 (시간)<input name="hol" type="number" min="0" value="${v.hol}"></label>
    <label>이전 사용 연차 (일)<input name="leavePrev" type="number" min="0" value="${v.leavePrev}"></label>
    <p class="sub-row full">실제 주민번호·연락처·주소 등 개인정보는 입력하지 마세요. 시제품은 브라우저에만 저장됩니다.</p>

    label: isNew ? '추가' : '저장', fn: f => {
      const name = fval(f, 'name').trim();

function setAtt(id, day, patch) {
  const recs = S.att[id] || (S.att[id] = []);

  const dt = new Date(D.base.getFullYear(), D.base.getMonth(), day), [st, en] = shift(dt), isToday = day === D.day;
  if ('s' in patch) {
    r.s = patch.s;
    if (['결근', '휴가', '휴무'].includes(r.s)) r.i = r.o = null;
    else {
      if (r.s === '지각') r.i = r.i != null && r.i > st ? r.i : st + 15; else if (r.i == null || r.i > st) r.i = st - 10;
      if (r.s === '조퇴') r.o = r.o != null && r.o < en ? r.o : en - 120; else if (!isToday && (r.o == null || r.o < en)) r.o = en;
    }
  }
  if ('i' in patch) r.i = patch.i;
  if ('o' in patch) r.o = patch.o;
}

/* ========== 3. 급여 관리 ========== */
function pagePayroll(v) {
  const L = D.last, P = D.pay.filter(p => !p.e.owner), pf = S.payFactor.slice(12);
  const y = +L.k.slice(0, 4), mw = minWage(y), mwN = MIN_WAGE.find(r => r[0] === y + 1)?.[1];
  const under = P.filter(p => p.hourly < mw), underN = mwN ? P.filter(p => p.hourly < mwN) : [];
  v.innerHTML = `
  <div class="notice"><span class="ic warn" aria-hidden="true">!</span><div><b>예시 데이터·예시 계산입니다. 실제 세금 및 4대보험 계산은 추후 별도 검증이 필요합니다.</b><br>
  급여는 임의의 예시 데이터이며, 공제는 단순화한 요율(국민연금 4.75%·상한 637만원, 건강보험 3.595%, 장기요양 건강보험료의 13.14%, 고용보험 0.9%, 소득세는 간이세액표가 아닌 단순 누진 예시)로 계산했습니다.
  시급은 기본급 ÷ 209시간(주 40시간 기준 월 소정근로시간), 1.5배 시급은 연장·휴일근로에 적용되는 금액이며 야간은 0.5배 가산으로 단순화했습니다. 세전 금액 = 모든 지급 항목의 합, 세후 금액 = 세전 금액 − 공제계입니다. 최저임금 점검은 기본급 ÷ 209시간으로 단순 비교하며, 실제로는 매월 지급되는 정기상여금·복리후생비 등 산입범위를 반영해 판단해야 합니다. 실제 적용 전 노무사·세무사 검증이 필요합니다. 대표원장(사업주)은 급여 대상에서 제외합니다.</div></div>
  <div class="kpis">
    ${kpi('급여 기준월', monFull(L.k), `지급 대상 ${P.length}명`)}
    ${kpi('세전 금액 합계', krw(D.payGross), `1인 평균 ${krw(D.payGross / Math.max(1, P.length))}`)}
    ${kpi('공제 총액', krw(D.payDed), `4대보험·소득세 (근로자 부담)`)}
    ${kpi('세후 금액 합계', krw(D.payNet), `1인 평균 ${krw(D.payNet / Math.max(1, P.length))}`)}
    ${kpi('사업주 부담 포함 인건비', krw(D.laborCost), `사업주 4대보험 등 ${krw(D.payEr)}`)}
    ${kpi('매출 대비 인건비율', pct(L.laborRatio), `${mon(L.k)} 매출 ${krw(L.rev)}`)}
    ${kpi(`${y}년 최저시급`, won(mw), `주 40시간 정규직 월 최저 <b>${won(mw * MIN_HOURS)}</b>`)}
    ${kpi('최저임금 점검', under.length ? `<span class="neg">미달 ${under.length}명</span>` : '<span class="pos">전원 충족</span>', mwN ? `${y + 1}년 (${won(mwN)}) 기준 미달 예정 <b>${underN.length}명</b>` : '기본급 ÷ 209시간 기준')}
  </div>
  <div class="grid2">
    ${panel('월별 급여 변동 추이', '<div class="chart" id="c-pay12"></div>', '세전 금액·세후 금액 (최근 12개월)')}
    ${panel('부서별 인건비 합계', '<div class="chart" id="c-paydept"></div>', '사업주 부담 포함')}
  </div>
  ${panel('연도별 최저임금 기준', '<div id="t-mw"></div>', '주 40시간 정규직 기준 · 월 209시간 = (주 40시간 + 주휴 8시간) × 월 평균 4.345주')}
  ${panel(`직원별 급여 명세 (${monFull(L.k)})`, '<div id="t-pay"></div>', '행을 클릭하면 기본급·수당·근로시간을 수정할 수 있습니다')}

  });
  const dc = DEPT_NAMES.map(d => sum(D.pay.filter(p => p.e.dept === d), 'cost'));
  drawChart($('#c-paydept'), { type: 'hbar', labels: DEPT_NAMES, series: [{ name: '인건비', color: SC(0), values: dc }] });
  const m = k => ({ key: k[0], label: k[1], num: true, fmt: num, total: true });
  table($('#t-pay'), {
    id: 'pay', rows: D.pay, rowId: p => p.e.id, onRow: editEmp, csv: `급여명세_${L.k}`, ph: '이름·사번 검색', searchText: p => p.e.id + ' ' + p.e.name, totals: true,
    filters: [{ key: 'dept', label: '부서', options: DEPT_NAMES, get: p => p.e.dept }, { key: 'rank', label: '직급', options: RANKS, get: p => p.e.rank }],
    columns: [
      { key: 'id', label: '사번', get: p => p.e.id }, { key: 'name', label: '이름', get: p => p.e.name }, { key: 'dept', label: '부서', get: p => p.e.dept }, { key: 'rank', label: '직급', get: p => p.e.rank },
      { key: 'hourly', label: '시급', num: true, fmt: x => x ? won(x) : '—' },
      { key: 'hourly15', label: '1.5배 시급', num: true, fmt: x => x ? won(x) : '—' },
      { key: 'mwr', label: `${y}년 최저시급 대비`, num: true, get: p => p.hourly ? p.hourly / mw : 0, csv: p => p.hourly ? pct(p.hourly / mw, 0) : '',
        html: p => !p.hourly ? '—' : p.hourly < mw ? badge('미달 ' + pct(p.hourly / mw, 0), 'crit') : p.hourly < mw * 1.05 ? badge('근접 ' + pct(p.hourly / mw, 0), 'warn') : pct(p.hourly / mw, 0) },
      ...[['base', '기본급'], ['pos', '직책수당'], ['otPay', '연장수당'], ['nightPay', '야간수당'], ['holPay', '휴일수당'], ['meal', '식대'], ['other', '기타수당'], ['gross', '세전 금액'],
      ['pension', '국민연금'], ['health', '건강보험'], ['ltc', '장기요양'], ['empIns', '고용보험'], ['tax', '소득세'], ['local', '지방소득세'], ['ded', '공제계'], ['net', '세후 금액'], ['cost', '사업주부담 포함']].map(m),
    ],
  });
  table($('#t-mw'), {
    id: 'mw', rows: MIN_WAGE.map(([yr, w], j) => ({ yr, w, inc: j ? w / MIN_WAGE[j - 1][1] - 1 : null })), csv: '연도별최저임금', search: false, sort: 'yr', sortDir: -1,
    columns: [
      { key: 'yr', label: '연도', fmt: x => x + '년' },
      { key: 'st', label: '구분', get: r => r.yr === y ? '적용 중' : r.yr > y ? '시행 예정' : '과거', html: r => r.yr === y ? badge('적용 중', 'good') : r.yr > y ? badge('시행 예정', 'info') : '<span class="sub-row">과거</span>' },
      { key: 'w', label: '최저시급', num: true, fmt: won },
      { key: 'inc', label: '인상률', num: true, fmt: x => x == null ? '—' : sgnPct(x) },
      { key: 'w15', label: '1.5배 시급 (연장·휴일)', num: true, get: r => Math.round(r.w * 1.5), fmt: won },
      { key: 'day', label: '일급 (8시간)', num: true, get: r => r.w * 8, fmt: won },
      { key: 'month', label: '월 최저 (209시간)', num: true, get: r => r.w * MIN_HOURS, fmt: won },
      { key: 'yearly', label: '연 최저 (12개월)', num: true, get: r => r.w * MIN_HOURS * 12, fmt: won },
    ],
  });
}

function simInit() {

      <button type="button" class="btn ghost" id="b-sim-reset">기준값으로 초기화</button>
    </form><div><div class="mini" id="sim-out"></div><div class="chart" id="c-sim" style="margin-top:14px"></div></div></div>`;
  const form = $('#f-sim');
  form.addEventListener('input', e => {
    if (e.target.name === 'm') return;
    ['rev', 'labor', 'mat', 'ad', 'rent', 'fixed'].forEach(k => s[k] = k === 'fixed' ? toInt(form.elements[k].value) : +form.elements[k].value || 0);
    simRun();
  });
  form.elements.m.onchange = e => { UI.sim = simDefaults(+e.target.value); simInit(); };
  $('#b-sim-reset').onclick = () => { UI.sim = simDefaults(s.m); simInit(); };
  simRun();
}
function simDefaults(m) {
  const b = D.fin[m];
  return { m, rev: 0, labor: 0, mat: Math.round(b.costs.material / b.rev * 200) / 2, ad: 0, rent: b.costs.rent, fixed: 0 };
}
function simRun() {
  const s = UI.sim, b = D.fin[s.m];
  ['rev', 'labor', 'mat', 'ad'].forEach(k => { const o = $('#o-' + k); if (o) o.textContent = k === 'mat' ? s[k].toFixed(1) + '%' : (s[k] > 0 ? '+' : '') + s[k] + '%'; });
  const rev = b.rev * (1 + s.rev / 100), labor = b.labor * (1 + s.labor / 100), mat = rev * s.mat / 100, ad = b.ad * (1 + s.ad / 100);
  const fixed = labor + s.rent + ad + b.costs.equip + b.costs.util + b.costs.other + s.fixed;
  const total = fixed + mat, op = rev - total, bep = s.mat < 100 ? fixed / (1 - s.mat / 100) : 0;
  const dOp = op - b.op;
  $('#sim-out').innerHTML = [
    ['예상 매출', krw(rev), deltaHTML(rev / b.rev - 1)],
    ['예상 총비용', krw(total), deltaHTML(total / b.total - 1, false)],
    ['예상 영업이익', krw(op), `<em class="${dOp >= 0 ? 'pos' : 'neg'}">기준 대비 ${dOp >= 0 ? '+' : ''}${krw(dOp)}</em>`],
    ['예상 영업이익률', pct(rev ? op / rev : 0), `<em>기준 ${pct(b.margin)}</em>`],
    ['예상 인건비율', pct(rev ? labor / rev : 0), `<em>기준 ${pct(b.laborRatio)}</em>`],
    ['손익분기 매출', krw(bep), `<em>고정비 ÷ (1 − 재료비율)</em>`],
  ].map(([l, v, d]) => `<div><span>${l}</span><b>${v}</b>${d}</div>`).join('');
  drawChart($('#c-sim'), { type: 'bar', labels: ['매출', '총비용', '영업이익'], height: 200, series: [{ name: `기준 (${mon(b.k)})`, color: SC(6), values: [b.rev, b.total, b.op] }, { name: '시뮬레이션', color: SC(0), values: [rev, total, op] }], labelW: 60 });
}

    <li>매출 = 진료 유형별 매출의 합 (외래 진찰 + 영상검사 + 물리치료 + 도수치료 + 체외충격파 + 주사·시술)</li>
    <li>환자 1인당 평균 매출 = <code>매출 ÷ 내원 환자 수</code></li>
    <li>목표 달성률 = <code>누적 매출 ÷ 목표 매출</code> · 월말 예상 = <code>누적 매출 ÷ 경과 일수 × 해당 월 일수</code></li>
    <li>인건비 = <code>직원 지급총액 + 사업주 부담 4대보험 등</code> (마감월 기준, 과거 월은 당시 인원·임금 수준 계수 적용)</li>
    <li>매출 대비 인건비율 = <code>인건비 ÷ 매출</code></li>
    <li>총비용 = <code>인건비 + 임대료 + 재료·약품비 + 광고비 + 장비 리스·감가 + 관리비·공과금 + 기타 운영비</code></li>
    <li>영업이익 = <code>매출 − 총비용</code> · 영업이익률 = <code>영업이익 ÷ 매출</code></li>
    <li>전월 대비 성장률 = <code>이번 달 매출 ÷ 전월 매출 − 1</code> · 전년 동월 대비 = <code>이번 달 매출 ÷ 전년 같은 달 매출 − 1</code></li>
    <li>CAC = <code>채널 비용 ÷ 신규 환자 수</code> · ROI = <code>(귀속 매출 − 비용) ÷ 비용</code> · 예약 전환율 = <code>예약 ÷ 문의</code></li>
    <li>손익분기 매출 = <code>고정비 ÷ (1 − 재료·약품비율)</code></li>
  </ol>`)}`;
  $('#b-exp').onclick = () => download(`hospital_backup_${S.baseDate}.json`, JSON.stringify(S, null, 1), 'application/json');
  $('#b-imp').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const o = JSON.parse(fr.result);
        if (!(o && o.v === 1 && Array.isArray(o.emps) && o.months?.length === 24)) throw new Error();
        S = o; commit('백업 데이터를 불러왔습니다');
      } catch (err) { toast('올바른 백업 파일이 아닙니다'); }
    };
    fr.readAsText(file);
  };
  $('#b-reset').onclick = e => {
    const b = e.currentTarget;
    if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = '한 번 더 누르면 초기화'; return; }
    S = generate(ymd(new Date())); Object.keys(TS).forEach(k => delete TS[k]); UI.sim = null; UI.attDay = null;
    commit('예시 데이터로 초기화했습니다');
  };
  $$('[data-csv]').forEach(b => b.onclick = () => {
    const t = b.dataset.csv, c = (key, label, get) => ({ key, label, get });
    if (t === 'emp') csvDownload('직원목록', [c('id', '사번'), c('name', '이름'), c('dept', '부서'), c('rank', '직급'), c('hire', '입사일')], S.emps);
    if (t === 'att') {
      const rows = [];
      S.emps.forEach(e => (S.att[e.id] || []).forEach(r => rows.push({ e, r })));
      csvDownload(`근태기록_${D.curK}`, [c('id', '사번', x => x.e.id), c('name', '이름', x => x.e.name), c('dept', '부서', x => x.e.dept), c('d', '날짜', x => `${D.curK}-${pad(x.r.d)}`), c('s', '상태', x => x.r.s), c('i', '출근', x => x.r.i == null ? '' : hm(x.r.i)), c('o', '퇴근', x => x.r.o == null ? '' : hm(x.r.o)), c('h', '근무시간(h)', x => (workMin(x.r) / 60).toFixed(1))], rows);
    }
    if (t === 'pay') csvDownload(`급여명세_${D.last.k}`, [c('id', '사번', p => p.e.id), c('name', '이름', p => p.e.name), c('dept', '부서', p => p.e.dept), ...['hourly', 'hourly15', 'base', 'pos', 'otPay', 'nightPay', 'holPay', 'meal', 'other', 'gross', 'pension', 'health', 'ltc', 'empIns', 'tax', 'local', 'ded', 'net', 'cost'].map(k => c(k, { hourly: '시급', hourly15: '1.5배시급', base: '기본급', pos: '직책수당', otPay: '연장수당', nightPay: '야간수당', holPay: '휴일수당', meal: '식대', other: '기타수당', gross: '세전금액', pension: '국민연금', health: '건강보험', ltc: '장기요양', empIns: '고용보험', tax: '소득세', local: '지방소득세', ded: '공제계', net: '세후금액', cost: '사업주부담포함' }[k]))], D.pay);
    if (t === 'pl') csvDownload('월별손익계산서', [c('k', '월'), c('rev', '매출'), ...COSTS.map(([k, n]) => c(k, n, r => r.costs[k])), c('total', '총비용'), c('op', '영업이익'), c('m', '영업이익률', r => (r.margin * 100).toFixed(1) + '%')], D.v12);
    if (t === 'mkt') {
      const rows = [];
      D.mkt.slice(12).forEach(m => CH.forEach(([k, n]) => rows.push({ k: m.k, n, ...m.ch[k] })));
      csvDownload('마케팅채널성과', [c('k', '월'), c('n', '채널'), c('cost', '비용'), c('inq', '문의'), c('book', '예약'), c('newp', '신규환자'), c('rev', '귀속매출'), c('cac', 'CAC', r => Math.round(r.cac)), c('roi', 'ROI', r => (r.roi * 100).toFixed(0) + '%')], rows);
    }
    if (t === 'daily') csvDownload('일별매출', [c('date', '날짜'), c('rev', '매출'), c('pt', '내원환자'), c('np', '신규환자')], S.daily);
  });
}

/* ========== 7. 신규 환자 문진 (QR 문진 앱 연동) ========== */
// 문진 앱의 집계 API만 호출한다. 이름·연락처 등 개인정보는 이 화면으로 오지 않는다.
const INTAKE_APP = 'https://patient-intake-form-green.vercel.app';
const INTAKE = { days: 30, cache: {} };
async function fetchIntakeStats(days) {
  const hit = INTAKE.cache[days];
  if (hit && Date.now() - hit.at < 60000) return hit.data;
  const res = await fetch(`${INTAKE_APP}/api/intake/stats?days=${days}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  INTAKE.cache[days] = { at: Date.now(), data };
  return data;
}
function loadQR(el, text) {
  const draw = () => { el.innerHTML = ''; new QRCode(el, { text, width: 148, height: 148, correctLevel: QRCode.CorrectLevel.M }); };
  if (window.QRCode) return draw();
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload = draw;
  s.onerror = () => { el.innerHTML = '<p class="sub-row">QR 코드를 불러오지 못했습니다.</p>'; };
  document.head.appendChild(s);
}
function pageIntake(v) {
  const days = INTAKE.days;
  v.innerHTML = `
  <div class="notice info"><span class="ic good" aria-hidden="true">i</span><div>이 화면은 <b>실제 QR 문진 제출 데이터</b>의 집계 통계입니다. 개인정보(이름·연락처·병력)는 표시하지 않으며 1분마다 갱신됩니다.</div></div>
  <div class="panel-act" style="margin-bottom:14px"><label class="sub-row" for="in-days">조회 기간</label><select id="in-days">${opts([[7, '최근 7일'], [30, '최근 30일'], [90, '최근 90일']], days)}</select></div>
  <div id="in-body"><p class="sub-row">문진 통계를 불러오는 중…</p></div>
  <div class="grid2">
    ${panel('문진 QR 코드', `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div id="in-qr" style="background:#fff;padding:8px;border-radius:8px;line-height:0"></div><div><p class="sub-row" style="margin:0 0 10px">접수대·대기실에 비치해 신규 환자가 스캔하도록 안내하세요.</p><a class="btn" href="${INTAKE_APP}" target="_blank" rel="noopener">문진 앱 열기</a></div></div>`, INTAKE_APP.replace('https://', ''))}
  </div>`;
  loadQR($('#in-qr'), INTAKE_APP);
  $('#in-days').onchange = e => { INTAKE.days = +e.target.value; render(true); };
  fetchIntakeStats(days).then(s => {
    const body = $('#in-body');
    if (!body || INTAKE.days !== days) return; // 다른 화면으로 이동했거나 기간이 바뀜
    const cnt = n => num(n) + '건', bars = (id, list) => list.length
      ? drawChart($('#' + id), { type: 'hbar', labels: list.map(r => r.label), series: [{ name: '건수', color: SC(0), values: list.map(r => r.count) }], fmt: cnt })
      : ($('#' + id).innerHTML = '<p class="sub-row">기간 내 제출 없음</p>');
    body.innerHTML = `
    <div class="kpis">
      ${kpi('오늘 문진 제출', cnt(s.todayCount), `${fmtDate(parseD(s.today))} 기준`)}
      ${kpi(`최근 ${s.days}일 제출`, cnt(s.total), `일평균 ${(s.total / s.days).toFixed(1)}건`)}
      ${kpi('평균 통증 점수', s.avgPainScore == null ? '—' : `${s.avgPainScore} / 10`, '환자 자가 평가 (0~10)')}
      ${kpi('최다 유입 경로', esc(s.channels[0]?.label || '—'), s.channels[0] ? `${cnt(s.channels[0].count)} · ${pct(s.channels[0].count / s.total)}` : '기간 내 제출 없음')}
    </div>
    ${panel(`일별 문진 제출 (최근 ${s.days}일)`, '<div class="chart" id="in-daily"></div>', '막대에 마우스를 올리면 건수 표시')}
    <div class="grid3">
      ${panel('유입 경로', '<div class="chart" id="in-ch"></div>', '마케팅 관리의 채널별 신규 환자와 비교해 보세요')}
      ${panel('통증 부위', '<div class="chart" id="in-area"></div>')}
      ${panel('내원 목적', '<div class="chart" id="in-goal"></div>', '복수 선택 항목')}
    </div>`;
    drawChart($('#in-daily'), {
      type: 'bar', labels: s.daily.map(r => { const d = parseD(r.date); return `${d.getMonth() + 1}/${d.getDate()}`; }),
      tipLabels: s.daily.map(r => fmtDate(parseD(r.date))), labelW: 40, fmt: cnt, axis: n => num(n),
      series: [{ name: '문진 제출', color: SC(0), values: s.daily.map(r => r.count) }],
    });
    bars('in-ch', s.channels); bars('in-area', s.painAreas); bars('in-goal', s.visitGoals);
  }).catch(() => {
    const body = $('#in-body');
    if (body) body.innerHTML = `<div class="notice"><span class="ic warn" aria-hidden="true">!</span><div>문진 앱(${esc(INTAKE_APP)})에서 통계를 불러오지 못했습니다. 문진 앱 배포 상태와 Supabase 설정을 확인하세요.</div></div>`;
  });
}

/* ========== 라우팅 ========== */
const PAGES = { dashboard: ['경영 대시보드', pageDashboard], hr: ['인사·근태 관리', pageHR], payroll: ['급여 관리', pagePayroll], finance: ['매출·재무 관리', pageFinance], marketing: ['마케팅 관리', pageMarketing], intake: ['신규 환자 문진', pageIntake], data: ['데이터 관리', pageData] };
function render(keepScroll) {
  const p = PAGES[location.hash.slice(1)] ? location.hash.slice(1) : 'dashboard';
  const y = window.scrollY;
  CHARTS.clear();
  $('#title').textContent = PAGES[p][0];
  document.title = `${PAGES[p][0]} · 삼성365정형외과`;
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.p === p));
  $('#chip-date').textContent = `기준일 ${fmtDate(D.base)}`;
  PAGES[p][1]($('#view'));
  window.scrollTo(0, keepScroll ? y : 0);
}
window.addEventListener('hashchange', () => { document.body.classList.remove('nav-open'); render(false); });
$('#menu').onclick = () => document.body.classList.toggle('nav-open');
$('#scrim').onclick = () => document.body.classList.remove('nav-open');

S = load() || generate(ymd(new Date()));
save(); derive(); render(false);
</script>
